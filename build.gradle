plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        client {
            runDir = project.findProperty('runDir')
                    ?: ["voxy": "run-voxy", "both": "run-both", "neither": "run-neither"].getOrDefault(project.findProperty('lodBackend'), "run-dh")
            property("wynnvista.fixture.autoload", "New World")
            property("wynnvista.fixture.autostopTicks", System.getenv("WYNNVISTA_FIXTURE_AUTOSTOP_TICKS") ?: "400")
            if (System.getenv("WYNNVISTA_FIXTURE_CREATE_WORLD")) {
                property("wynnvista.fixture.createWorld", System.getenv("WYNNVISTA_FIXTURE_CREATE_WORLD"))
            }
            if (System.getenv("WYNNVISTA_FIXTURE_COMMANDS")) {
                property("wynnvista.fixture.commands", System.getenv("WYNNVISTA_FIXTURE_COMMANDS"))
            }
            if (System.getenv("WYNNVISTA_FIXTURE_SCREENSHOT")) {
                property("wynnvista.fixture.screenshot", System.getenv("WYNNVISTA_FIXTURE_SCREENSHOT"))
            }
            if (System.getenv("WYNNVISTA_FIXTURE_TIMELINE")) {
                property("wynnvista.fixture.timeline", System.getenv("WYNNVISTA_FIXTURE_TIMELINE"))
            }
            if (System.getenv("WYNNVISTA_FIXTURE_CAPTURE_PREFIX")) {
                property("wynnvista.fixture.capturePrefix", System.getenv("WYNNVISTA_FIXTURE_CAPTURE_PREFIX"))
            }
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
    if (project.findProperty('betterClouds') == 'true') {
        // Libraries Better Clouds and YACL bundle, for a development run only.
        maven { url "https://maven.bawnorton.com/releases" }
        maven { url "https://maven.quiltmc.org/repository/release" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation 'com.google.code.gson:gson:2.8.9'

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Distant Horizons API (optional - compile only)
    compileOnly "maven.modrinth:distanthorizonsapi:${project.dh_api_version}"
    modCompileOnly "maven.modrinth:distanthorizons:${project.dh_mod_version}"

    // Distant Horizons mod (runtime only for testing)
    // Enable with -PlodBackend=dh (or both) for an isolated development run.

    if (project.findProperty('lodBackend') in ['dh', 'both']) {
        modRuntimeOnly "maven.modrinth:distanthorizons:${project.dh_mod_version}"
    }

    // WynnIris (optional - compile only; mixin targets for the Iris shader-pack paths).
    // Enable with -Piris=true for an isolated development run (any lodBackend).
    modCompileOnly "maven.modrinth:wynniris:${project.wynniris_artifact_version}"
    if (project.findProperty('iris') == 'true') {
        modRuntimeOnly "maven.modrinth:wynniris:${project.wynniris_artifact_version}"
        modRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
        // Loom does not load WynnIris's jar-in-jar libraries in a development run.
        runtimeOnly "org.antlr:antlr4-runtime:4.13.1"
        runtimeOnly "io.github.douira:glsl-transformer:3.0.0-pre3"
        runtimeOnly "org.anarres:jcpp:1.4.14"
    }

    // Voxy (optional - compile only; Sodium supplies types in Voxy's signatures).
    // Enable with -PlodBackend=voxy (or both) for an isolated development run.
    modCompileOnly "maven.modrinth:voxy:${project.voxy_artifact_version}"
    modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
    if (project.findProperty('lodBackend') in ['voxy', 'both']) {
        modRuntimeOnly "maven.modrinth:voxy:${project.voxy_artifact_version}"
        modRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
        // Loom does not load Voxy's jar-in-jar libraries in a development run; supply them (same versions Voxy bundles).
        def lwjglNatives = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "natives-windows"
                : org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "natives-macos-arm64" : "natives-linux"
        runtimeOnly "org.rocksdb:rocksdbjni:10.2.1"
        runtimeOnly "redis.clients:jedis:5.1.0"
        runtimeOnly "org.apache.commons:commons-pool2:2.12.0"
        runtimeOnly "org.tukaani:xz:1.10"
        runtimeOnly "org.lwjgl:lwjgl-lmdb:3.3.3"
        runtimeOnly "org.lwjgl:lwjgl-lmdb:3.3.3:${lwjglNatives}"
        runtimeOnly "org.lwjgl:lwjgl-zstd:3.3.3"
        runtimeOnly "org.lwjgl:lwjgl-zstd:3.3.3:${lwjglNatives}"
    }

    // Better Clouds (optional - not compiled against; its renderer is hooked by name).
    // Enable with -PbetterClouds=true for an isolated development run (any lodBackend).
    if (project.findProperty('betterClouds') == 'true') {
        modRuntimeOnly "maven.modrinth:better-clouds:${project.betterclouds_artifact_version}"
        modRuntimeOnly "maven.modrinth:yacl:${project.yacl_artifact_version}"
        // Loom does not load their jar-in-jar libraries in a development run; supply them (same versions they bundle).
        modRuntimeOnly "com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.2.0"
        runtimeOnly "gs.mclo:api:5.0.0"
        runtimeOnly "org.quiltmc.parsers:json:0.2.1"
        runtimeOnly "org.quiltmc.parsers:gson:0.2.1"
        runtimeOnly "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
    }

    // ModMenu
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Cloth Config
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation "maven.modrinth:distanthorizons:${project.dh_mod_version}"
    testImplementation "maven.modrinth:voxy:${project.voxy_artifact_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('runClient', JavaExec) {
    if (project.hasProperty('fixtureJava')) {
        executable = project.property('fixtureJava')
    }
    if (project.hasProperty('fixtureCheckJni')) {
        jvmArgs '-Xcheck:jni'
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
