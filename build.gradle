plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        client {
            runDir = project.findProperty('runDir') ?: "run-dh"
            property("wynnvista.fixture.autoload", "New World")
            property("wynnvista.fixture.autostopTicks", "400")
            if (System.getenv("WYNNVISTA_FIXTURE_COMMANDS")) {
                property("wynnvista.fixture.commands", System.getenv("WYNNVISTA_FIXTURE_COMMANDS"))
            }
            if (System.getenv("WYNNVISTA_FIXTURE_SCREENSHOT")) {
                property("wynnvista.fixture.screenshot", System.getenv("WYNNVISTA_FIXTURE_SCREENSHOT"))
            }
            if (System.getenv("WYNNVISTA_FIXTURE_TIMELINE")) {
                property("wynnvista.fixture.timeline", System.getenv("WYNNVISTA_FIXTURE_TIMELINE"))
            }
            if (System.getenv("WYNNVISTA_FIXTURE_CAPTURE_PREFIX")) {
                property("wynnvista.fixture.capturePrefix", System.getenv("WYNNVISTA_FIXTURE_CAPTURE_PREFIX"))
            }
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation 'com.google.code.gson:gson:2.8.9'

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Distant Horizons API (optional - compile only)
    compileOnly "maven.modrinth:distanthorizonsapi:${project.dh_api_version}"
    modCompileOnly "maven.modrinth:distanthorizons:${project.dh_mod_version}"

    // Distant Horizons mod (runtime only for testing)
    // Enable with -PlodBackend=dh for an isolated development run.

    // Voxy integration is intentionally deferred until its renderer adapter is implemented.
    if (project.findProperty('lodBackend') == 'dh') {
        modRuntimeOnly "maven.modrinth:distanthorizons:${project.dh_mod_version}"
    }

    // ModMenu
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Cloth Config
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation "maven.modrinth:distanthorizons:${project.dh_mod_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('runClient', JavaExec) {
    if (project.hasProperty('fixtureJava')) {
        executable = project.property('fixtureJava')
    }
    if (project.hasProperty('fixtureCheckJni')) {
        jvmArgs '-Xcheck:jni'
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
